services:

  db:
    image: mysql:8.0
    container_name: project-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
  backend:
    build:
      context: ./backend
    container_name: project-backend
    depends_on:
      - db
    ports:
      - "8081:8080"
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    container_name: project-frontend
    depends_on:
      - backend
    ports:
      - "4200:80"
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge
